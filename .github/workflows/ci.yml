name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: backend (tests + lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secureconfigai
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: secureconfigai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://secureconfigai:ci-only-not-a-secret@localhost:5432/secureconfigai_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies (pinned set)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Lint
        run: |
          python -m pip install "ruff>=0.6,<1"
          python -m ruff check backend scanner scripts
          python -m ruff format --check backend scanner scripts

      - name: Tests (SQLite isolation + PostgreSQL integration)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan the tree for credentials
        run: python scripts/scan_secrets.py

  release:
    name: release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and validate the release tree (no archive)
        run: python scripts/build_release.py --no-archive
      - name: The release must not contain local configuration or databases
        run: |
          set -eu
          test ! -e dist_release/secureconfigai_v3-2.0.0/backend/.env
          ! find dist_release -name '*.db' | grep -q .
          ! find dist_release -name '__pycache__' | grep -q .
          ! find dist_release -name 'node_modules' | grep -q .
