[pytest]
; The suite is run from this directory (`cd backend && python -m pytest`).
; `pythonpath = .` makes `app` and `tests` importable without an editable install, which
; is what lets a clean clone run the tests with only the declared dependencies.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    slow: slow or environment-dependent test
    postgres: requires TEST_DATABASE_URL pointing at a PostgreSQL test database
filterwarnings =
    error::DeprecationWarning:app.*
; Never let a stray .db file in the repository become a test database.
